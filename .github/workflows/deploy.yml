name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read   # workflow 전체는 read만
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # checkout 자격증명이 이후 action에 남지 않도록
      - uses: withastro/action@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write        # 배포 권한은 deploy job에만
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4